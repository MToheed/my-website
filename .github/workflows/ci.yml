name: CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run a command
        run: echo "CI workflow is running"

      - name: Build check
        run: |
          test -f index.html
          test -f style.css
          test -f contact.html
          echo "Build check passed"       
