name: CI Pipeline

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

env:
  APP_ENV: testing

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "1.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Access secret securely
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi

      - name: Display variables
        run: |
          echo "Environment $APP_ENV"
          echo "Version $APP_VERSION"

      - name: Run a command
        run: echo "CI workflow is running"
      - name: Build check
        run: |
          test -f index.html
          test -f style.css
          test -f contact.html
          echo "Build check passed"       
